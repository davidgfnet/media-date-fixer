name: build
on:
  push:
    branches: ["master"]

jobs:
  apk:
    runs-on: ubuntu-26.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: "platforms;android-36 build-tools;36.0.0" }
      - name: Install zip
        run: command -v zip || { sudo apt-get update && sudo apt-get install -y zip; }
      - name: Test
        run: make test
      - name: Build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            KS_PASS="$KEYSTORE_PASS" make ANDROID_SDK=$ANDROID_HOME KEYSTORE=release.keystore
            rm release.keystore
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "Release tags need the KEYSTORE_B64 and KEYSTORE_PASS secrets"; exit 1
          else
            make ANDROID_SDK=$ANDROID_HOME
          fi
      - uses: actions/upload-artifact@v6
        with: { name: mediadatefixer-apk, path: mediadatefixer.apk }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" mediadatefixer.apk --generate-notes

