name: build
on:
  push:
    branches: ["master"]
jobs:
  apk:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: "platforms;android-36 build-tools;36.0.0" }
      - name: Install zip
        run: command -v zip || { sudo apt-get update && sudo apt-get install -y zip; }
      - name: Test
        run: make test
      - name: Build
        run: make ANDROID_SDK=$ANDROID_HOME
      - uses: actions/upload-artifact@v6
        with: { name: mediadatefixer-apk, path: mediadatefixer.apk }
